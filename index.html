<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>فراوانیو</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6f3;--card:#fff;--tx:#12302a;--mut:#5d7b74;--pr:#0f766e;--pr2:#14b8a6;--ac:#e0a812;--bd:#d9e8e3;--sh:0 8px 24px rgba(15,118,110,.10);--glass:rgba(238,246,243,.82);--inp:#f3f8f6;--onpr:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1514;--card:#13262a;--tx:#e6f2ef;--mut:#8fb0a9;--pr:#2dd4bf;--pr2:#14b8a6;--ac:#f0c040;--bd:#22403b;--sh:0 8px 24px rgba(0,0,0,.35);--glass:rgba(10,21,20,.82);--inp:#0e1d1f;--onpr:#06211d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1514;--card:#13262a;--tx:#e6f2ef;--mut:#8fb0a9;--pr:#2dd4bf;--pr2:#14b8a6;--ac:#f0c040;--bd:#22403b;--sh:0 8px 24px rgba(0,0,0,.35);--glass:rgba(10,21,20,.82);--inp:#0e1d1f;--onpr:#06211d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:radial-gradient(420px 320px at 95% -5%,rgba(20,184,166,.22),transparent 70%),radial-gradient(380px 320px at -10% 45%,rgba(224,168,18,.14),transparent 70%);background-attachment:fixed;color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:10px;padding:12px 0;margin-bottom:6px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
header h1{font-size:21px;font-weight:800;margin:0;flex:1}
.back{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:3px 12px;font:inherit;font-size:14px;cursor:pointer;box-shadow:var(--sh)}
.pts{background:linear-gradient(135deg,#f5c542,#e08a12);color:#2a1c00;border-radius:20px;padding:2px 12px;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(224,138,18,.35)}
main{flex:1}
main>*{animation:up .45s ease both}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 6px;font-size:16px;font-weight:800}
.card h2{font-weight:800}
.mut{color:var(--mut);font-size:13px}
.banner{background:linear-gradient(135deg,#0f766e,#14b8a6 60%,#34d399);color:#fff;border-radius:26px;padding:18px;margin-bottom:16px;box-shadow:0 12px 28px rgba(15,118,110,.35);position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14);top:-60px;left:-40px}
.bt{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1}
.bt small{display:block;opacity:.85;font-size:12px;line-height:1.2}
.bt b{font-size:44px;line-height:1;font-weight:800}
.bs{background:rgba(255,255,255,.22);border-radius:20px;padding:2px 14px;font-weight:700;font-size:14px}
.banner .bar{background:rgba(255,255,255,.28);margin:12px 0 6px;position:relative;z-index:1}
.banner .bar div{background:#fff}
.banner p{margin:0;font-size:13px;opacity:.95;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px 8px 12px;text-align:center;font:inherit;color:var(--tx);cursor:pointer;box-shadow:var(--sh);transition:transform .15s;animation:up .5s ease both}
.tile:active{transform:scale(.95)}
.tile i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 6px;border-radius:20px;font-style:normal;font-size:28px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 16px color-mix(in srgb,var(--c2) 40%,transparent)}
.tile span{font-size:13px;font-weight:700}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:var(--onpr);border:0;border-radius:16px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;box-shadow:0 8px 18px rgba(20,184,166,.32);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.full{width:100%;text-align:center;margin-top:4px}
input,textarea,select{width:100%;background:var(--inp);color:var(--tx);border:1.5px solid var(--bd);border-radius:14px;padding:11px;font:inherit;margin:4px 0;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--pr2);box-shadow:0 0 0 4px rgba(20,184,166,.18)}
textarea{min-height:84px;resize:vertical}
.item{border-bottom:1px dashed var(--bd);padding:9px 0;font-size:14px}
.item:last-child{border:0}
.chk{display:flex;gap:12px;align-items:center;padding:11px 12px;margin:6px 0;background:var(--inp);border-radius:16px;cursor:pointer;transition:background .2s}
.chk i{width:26px;height:26px;border:2px solid var(--pr2);border-radius:9px;display:grid;place-items:center;font-style:normal;color:#fff;flex:none;transition:all .2s}
.chk.on{background:color-mix(in srgb,var(--pr2) 14%,var(--card))}
.chk.on i{background:linear-gradient(135deg,var(--pr),var(--pr2));border-color:transparent}
.chk.on span{text-decoration:line-through;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#f5c542,#e08a12);border-radius:6px;transition:width .5s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px 6px;box-shadow:var(--sh)}
.stat b{font-size:26px;display:block;color:var(--pr);line-height:1.5}
.orb{width:130px;height:130px;border-radius:50%;margin:18px auto;background:radial-gradient(circle at 35% 30%,#fff7c2,var(--ac) 40%,var(--pr2));box-shadow:0 0 0 14px rgba(20,184,166,.12),0 0 40px rgba(240,192,64,.5);animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.72)}50%{transform:scale(1.12)}}
.hero{text-align:center;padding:22px 12px}
.hero .big{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 8px;font-size:44px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.22),rgba(20,184,166,.04));box-shadow:0 0 0 8px rgba(20,184,166,.07)}
.hero h2{margin:4px 0}
.st{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.st i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--inp);border:2px solid var(--bd);flex:none}
.st.ok i{background:var(--pr);color:var(--onpr);border-color:transparent}
.st.cur{font-weight:800}.st.cur i{border-color:var(--pr2)}
.bdg.off{opacity:.5;filter:grayscale(1)}
#ts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--card);color:var(--tx);border:1px solid var(--pr2);border-radius:16px;padding:9px 16px;font-size:14px;font-weight:700;box-shadow:var(--sh);max-width:calc(100% - 28px);animation:up .4s ease both}
footer{text-align:center;margin:10px auto 4px;padding:5px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);color:var(--mut);font-size:11px;direction:ltr;letter-spacing:.4px}
</style>
</head>
<body>
<div id="app"><header id="hd"></header><main id="mn"></main><footer>Developed by SM SADR | Powered by SMS_FX</footer></div>
<script>
var D=function(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var S={pts:0,days:{},goals:[],journal:[],seen:0,money:{n:0,last:'',best:0,resets:0,msg:0,log:[]},j:{n:0,last:'',log:[]},bd:{},wl:[]};
try{var raw=localStorage.getItem('faravanio');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem('faravanio',JSON.stringify(S))}catch(e){}}
function day(){var d=D();if(!S.days[d])S.days[d]={grat:[],m:[],viz:0,act:0};return S.days[d]}
function add(n){S.pts+=n;day().act=1;save();checkB()}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function val(id){return document.getElementById(id).value.trim()}
var M=['سه مورد قدردانی بنویس','یک جمله فراوانی را با صدای بلند بخوان','پول امروزت را خرج و ثبت کن','یک دقیقه هدفت را تصویرسازی کن','یک موفقیت امروزت را ثبت کن'];
var AF=['من شایسته‌ی فراوانی هستم و آن را با آغوش باز می‌پذیرم.','هر روز درهای تازه‌ای از فرصت به رویم باز می‌شود.','من با قدردانی، جریان فراوانی را در زندگی‌ام بیدار می‌کنم.','آنچه لازم دارم، در زمان درست به سمتم می‌آید.','من خالق زندگی پر از برکت و آرامش خودم هستم.','پول و فرصت‌ها با آسانی و شادی به من می‌رسند.','امروز یک قدم به هدفم نزدیک‌ترم.'];
var BL=['پول به‌سختی به دست می‌آید','من لایق ثروت نیستم','پولدارها آدم‌های خوبی نیستند','هیچ‌وقت به اندازه کافی نخواهم داشت','موفقیت مخصوص دیگران است','بدون فشار و استرس چیزی به دست نمی‌آید'];
var T={home:'🌱 فراوانیو',welcome:'خوش آمدی',daily:'تمرین روزانه',money:'مسیر ۳۶۰ روزه',goals:'هدف و تصویرسازی',dreams:'دفترچه آرزوها و اهداف',journal:'دفترچه موفقیت‌ها',about:'درباره بازی',badges:'نشان‌ها',smsfx:'SMS_FX'};
var cur=S.seen?'home':'welcome',timer=null;
function lvl(){return Math.floor(S.pts/100)+1}
function go(v){clearInterval(timer);vizRun=false;mcf=0;ged=-1;dsel=0;cur=v;render();window.scrollTo(0,0)}
function render(){
 var h=document.getElementById('hd'),m=document.getElementById('mn');
 h.innerHTML=(cur!=='home'&&cur!=='welcome'?'<button class="back" onclick="go(\'home\')">‹ بازگشت</button>':'')+'<h1>'+T[cur]+'</h1><span class="pts">⭐ '+S.pts+'</span>';
 m.innerHTML=V[cur]();
}
var V={};
V.welcome=function(){return '<div class="card hero"><div class="big">🌱</div><h2>به فراوانیو خوش آمدی</h2><p class="mut">بازی کوچک روزانه برای پرورش ذهنیت فراوانی: قدردانی، پول مجازی روزانه، هدف‌گذاری، تصویرسازی و ثبت دستاوردها. هر تمرین امتیاز می‌دهد و سطح تو بالا می‌رود.</p><button class="btn full" onclick="S.seen=1;save();go(\'home\')">شروع سفر</button></div>'};
V.home=function(){var t=day(),fa=function(n){return Number(n).toLocaleString('fa-IR')};
 var tl=[['daily','🙏','تمرین روزانه','#5eead4','#0f766e'],['money','🧭','مسیر ۳۶۰ روزه','#fcd34d','#d97706'],['goals','🎯','هدف و تصویرسازی','#fda4af','#e11d48'],['dreams','📒','دفترچه آرزوها و اهداف','#93c5fd','#2563eb'],['journal','📖','دفترچه موفقیت','#c4b5fd','#7c3aed'],['badges','🏅','نشان‌ها','#fde68a','#ca8a04'],['about','ℹ️','درباره بازی','#cbd5e1','#64748b'],['smsfx','📈','SMS_FX','#fdba74','#ea580c']];
 return '<div class="banner"><div class="bt"><div><small>سطح</small><b>'+fa(lvl())+'</b></div><div class="bs">⭐ '+fa(S.pts)+' امتیاز</div></div><div class="bar"><div style="width:'+(S.pts%100)+'%"></div></div><p>'+fa(100-S.pts%100)+' امتیاز تا سطح بعد · '+fa(S.wl.filter(function(w){return w.p<100}).length)+' هدف در جریان</p></div><div class="grid">'+tl.map(function(x,i){return '<button class="tile" style="--c1:'+x[3]+';--c2:'+x[4]+';animation-delay:'+(i*45)+'ms" onclick="go(\''+x[0]+'\')"><i>'+x[1]+'</i><span>'+x[2]+'</span></button>'}).join('')+'</div>'};
V.daily=function(){var t=day(),a=AF[new Date().getDate()%AF.length];
 var list=t.grat.map(function(g){return '<div class="item">🙏 '+esc(g)+'</div>'}).join('');
 return '<div class="card"><h3>جمله فراوانی امروز</h3><p style="font-size:17px;margin:4px 0">«'+a+'»</p><p class="mut">آن را آرام و با حس خوب تکرار کن.</p></div><div class="card"><h3>قدردانی امروز</h3><p class="mut">برای چه چیزی سپاسگزاری؟</p>'+list+(t.grat.length>=5?'<p class="mut" style="margin:10px 0 0">امروز به سقف ۵ مورد رسیدی. فردا دوباره بنویس 🌿</p>':'<input id="g" placeholder="امروز سپاسگزارم برای… ('+(5-t.grat.length).toLocaleString('fa-IR')+' مورد باقی مانده)"><button class="btn full" onclick="addG()">ثبت قدردانی (+۱۰)</button>')+'</div>'};
function addG(){var v=val('g');if(!v||day().grat.length>=5)return;day().grat.push(v);add(10);go('daily')}
var A=(function(){var lo=1,hi=1.2,r,i,k,t,p,v,a=[];for(i=0;i<200;i++){r=(lo+hi)/2;t=0;p=1e6;for(k=0;k<360;k++){t+=p;p*=r}if(t>1e12)hi=r;else lo=r}
 r=lo;p=1e6;t=0;for(k=0;k<359;k++){v=Math.round(p/1000)*1000;a.push(v);t+=v;p*=r}a.push(1e12-t);return a})();
function fmt(x){return Number(x).toLocaleString('fa-IR')+' تومان'}
function tot(n){var s=0;for(var i=0;i<n;i++)s+=A[i];return s}
function yest(){var d=new Date();d.setDate(d.getDate()-1);return D(d)}
function chk(){var m=S.money;if(m.n<360&&m.last&&m.last!==D()&&m.last!==yest()&&!m.miss){m.miss=1;save()}}
V.money=function(){chk();var m=S.money,done=m.last===D(),fin=m.n>=360;
 var si=fin?6:stg(m.n),tk=fin?['','']:taskFor(m.n),sc='<div class="card"><h3>مراحل مسیر ۳۶۰ روزه</h3>'+ST.map(function(s,i){var a=i<si,c=i===si,from=i?ST[i-1][1]+1:1;return '<div class="st'+(a?' ok':c?' cur':'')+'"><i>'+(a?'✓':faN(i+1))+'</i><div>'+s[0]+'<div class="mut" style="font-size:12px">روز '+faN(from)+' تا '+faN(s[1])+'</div></div></div>'}).join('')+'<p class="mut" style="margin:8px 0 0;font-size:12px">پایان هر مرحله ۳۰ امتیاز و هر ۳۰ روز ۲۰ امتیاز پاداش دارد.</p></div>',old=(S.j&&S.j.log&&S.j.log.length)?'<div class="card" style="margin-top:12px"><h3>پاسخ‌های مسیر ۲۱ روزهٔ قبلی</h3>'+S.j.log.map(function(e){return '<div class="item">🧭 '+esc(e.t)+'<div class="mut">'+e.d+'</div></div>'}).join('')+'</div>':'';
 var rb=(m.n>0&&!fin&&!m.miss)?(mcf?'<div style="margin-top:10px;padding:10px;border:1.5px dashed var(--bd);border-radius:14px"><p style="margin:0 0 8px;font-size:13px">مطمئنی؟ پیشرفت فعلی ('+faN(m.n)+' روز) در تاریخچه ثبت می‌شود و بازی از روز ۱ شروع می‌شود.</p><button class="btn" onclick="resetM(\'manual\')">بله، بازنشانی</button> <button class="btn" style="background:var(--inp);color:var(--tx);box-shadow:none" onclick="askR(0)">انصراف</button></div>':'<button class="btn" style="margin-top:10px;background:var(--inp);color:var(--tx);box-shadow:none" onclick="askR(1)">بازنشانی بازی</button>'):'';
 var hh=(m.hist&&m.hist.length)?'<div class="card" style="margin-top:12px"><h3>دوره‌های قبلی</h3>'+m.hist.slice().reverse().slice(0,10).map(function(h){return '<div class="item">🗂 '+faN(h.n)+' روز · '+fmt(h.tot)+'<div class="mut">'+({miss:'یک روز جا افتاد',manual:'بازنشانی دستی',done:'کامل شد 🏆'}[h.why]||'')+' · '+h.d+'</div></div>'}).join('')+'</div>':'';
 var l=m.log.slice().reverse().slice(0,20).map(function(e){return '<div class="item">📅 روز '+faN(e.i)+': '+fmt(e.a)+(e.r?'<br>🧭 '+esc(e.r):'')+'<br>💸 '+esc(e.t)+'<div class="mut">'+e.d+'</div></div>'}).join('');
 var top=m.miss&&!fin?'<div class="card hero"><div class="big">⏳</div><h3>یک روز جا افتاد</h3><p class="mut">پیشرفت این دوره ('+faN(m.n)+' روز) در تاریخچه می‌ماند و بازی از روز ۱ شروع می‌شود.</p><button class="btn full" onclick="resetM(\'miss\')">قبول و شروع از روز ۱</button></div>':'';
 var box;
 if(m.miss&&!fin)box='';else if(fin)box='<div class="card hero"><div class="big">🏆</div><h2>تبریک! مسیر ۳۶۰ روزه کامل شد</h2><p class="mut">مجموع پول مجازی تو:</p><h2 style="color:var(--pr);margin:0">'+fmt(tot(360))+'</h2><p class="mut">یعنی ۱ تریلیون تومان</p><button class="btn full" onclick="restartM()">شروع دوباره</button></div>';
 else if(done)box='<div class="card hero"><div class="big">✅</div><h3>امروز ثبت شد</h3><p class="mut">فردا: روز '+faN(m.n+1)+' · '+taskFor(m.n)[0]+'<br>مبلغ فردا:</p><h2 style="color:var(--pr);margin:0">'+fmt(A[m.n])+'</h2></div>';
